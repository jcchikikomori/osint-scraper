[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osint-scraper"
version = "0.1.0"
description = "Media scraper for social media profiles, starting with Instagram and Threads."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John Cyrill Corsanes" }]
keywords = ["osint", "scraper", "instagram", "threads", "media"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
# Instagram discovery. Kept optional so the core CLI works without it.
instagram = [
  "instaloader>=4.16",
]
# Browser cookie extraction. Kept optional so the core CLI works without them.
cookies = [
  "secretstorage>=3.3.3; sys_platform != 'darwin'",
]
# Video transport fallback (DASH merging for IG/FB videos).
media = [
  "yt-dlp>=2024.8.6",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
osint-scraper = "osint_scraper.cli:main"

[project.urls]
Homepage = "https://github.com/jcchikikomori/osint-scraper"
Repository = "https://github.com/jcchikikomori/osint-scraper"
Issues = "https://github.com/jcchikikomori/osint-scraper/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/osint_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "PTH", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["osint_scraper"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["instaloader", "gallery_dl", "yt_dlp", "secretstorage"]
ignore_missing_imports = true
